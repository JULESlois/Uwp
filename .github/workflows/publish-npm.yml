name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for staged publishing
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: npm install

      - name: Verify release metadata
        run: npm run release:check

      - name: Test
        run: npm test

      - name: Build public API example
        run: npm run build:example

      - name: Prepare and verify package
        run: npm run package:stage

      - name: Verify package tarball
        run: npm pack ./npm-package --dry-run --json

      - name: Stage package on npm
        run: npm stage publish ./npm-package --access public
