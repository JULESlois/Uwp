name: CI

on:
  push:
    branches:
      - 'automation/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build showcase
        run: npm run build
      - name: Build library
        run: npm run build:lib
      - name: Verify npm package
        run: npm run pack:check
      - name: Build public API example
        run: npm run build:example
